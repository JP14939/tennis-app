<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset your RallyMax password</title>
<style>
  :root {
    --bg: #ebe8df; --surface: #fcfaf4; --ink: #211d12; --muted: #6f6c62;
    --primary: #024726; --primary-dark: #003919; --coral: #e15a50;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 24px;
  }
  .card {
    background: var(--surface); border-radius: 20px; padding: 32px;
    max-width: 380px; width: 100%; box-shadow: 0 4px 24px rgba(0,0,0,0.08);
  }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p.sub { color: var(--muted); font-size: 14px; margin: 0 0 24px; line-height: 1.5; }
  label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
  input {
    width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid #d8d4c8;
    font-size: 15px; margin-bottom: 16px; background: #fff; color: var(--ink);
  }
  button {
    width: 100%; padding: 14px; border-radius: 10px; border: none;
    background: var(--primary); color: #fff; font-size: 15px; font-weight: 700; cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: default; }
  button:not(:disabled):hover { background: var(--primary-dark); }
  .msg { font-size: 14px; margin-top: 16px; line-height: 1.5; }
  .msg.error { color: var(--coral); }
  .msg.success { color: var(--primary); }
</style>
</head>
<body>
  <div class="card">
    <h1>Reset your password</h1>
    <p class="sub" id="sub">Enter a new password for your RallyMax account.</p>

    <form id="form">
      <label for="password">New password</label>
      <input type="password" id="password" minlength="8" required autocomplete="new-password">
      <label for="confirm">Confirm password</label>
      <input type="password" id="confirm" minlength="8" required autocomplete="new-password">
      <button type="submit" id="submit">Set new password</button>
    </form>

    <div id="msg"></div>
  </div>

<script>
  const params = new URLSearchParams(window.location.search);
  const token = params.get('token');
  const form = document.getElementById('form');
  const submitBtn = document.getElementById('submit');
  const msgEl = document.getElementById('msg');
  const sub = document.getElementById('sub');

  if (!token) {
    sub.textContent = 'This link is missing its reset token.';
    form.style.display = 'none';
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const password = document.getElementById('password').value;
    const confirm = document.getElementById('confirm').value;
    msgEl.textContent = '';
    msgEl.className = 'msg';

    if (password.length < 8) {
      msgEl.textContent = 'Password must be at least 8 characters.';
      msgEl.className = 'msg error';
      return;
    }
    if (password !== confirm) {
      msgEl.textContent = 'Passwords don\'t match.';
      msgEl.className = 'msg error';
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Setting password...';

    try {
      const res = await fetch('/api/auth/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, newPassword: password }),
      });
      if (res.status === 204) {
        form.style.display = 'none';
        sub.textContent = '';
        msgEl.textContent = 'Your password has been reset. You can now log in with your new password in the RallyMax app.';
        msgEl.className = 'msg success';
      } else {
        const data = await res.json().catch(() => ({}));
        msgEl.textContent = data.error || 'Something went wrong. This link may have expired -- request a new one from the app.';
        msgEl.className = 'msg error';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Set new password';
      }
    } catch (err) {
      msgEl.textContent = 'Could not reach the server. Please try again.';
      msgEl.className = 'msg error';
      submitBtn.disabled = false;
      submitBtn.textContent = 'Set new password';
    }
  });
</script>
</body>
</html>
