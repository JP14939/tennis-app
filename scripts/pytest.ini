[pytest]
# Only collect real assert-based regression tests (test_*_pytest.py),
# distinct from the existing manual diagnostic scripts also named
# test_*.py (test_net_detector_labeled_set.py etc.) which use argparse/
# hardcoded paths and print results rather than assert -- pytest would
# either fail to collect them usefully or run something that isn't
# actually a test. New pytest suites added going forward should use this
# *_pytest.py naming so they're picked up automatically without needing
# this list extended.
python_files = test_*_pytest.py
