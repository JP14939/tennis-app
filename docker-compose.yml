version: '3.8'

services:
  app:
    build: .
    container_name: tennis_app_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - backend/.env
    volumes:
      # Both gitignored (data/ is 12GB+, backend/data holds the SQLite file)
      # -- not baked into the image, must exist on the host already. See
      # DEPLOY.md for how to get data/ onto a fresh server.
      - ./data:/app/data
      - ./backend/data:/app/backend/data

  caddy:
    image: caddy:2
    container_name: tennis_app_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddyfile
      - caddy_data:/data
      - caddy_config:/config
    command: caddy run --config /etc/caddyfile --adapter caddyfile
    depends_on:
      - app

  postgres:
    image: postgres:16-alpine
    container_name: tennis_app_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tennis_app_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: tennis_app_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
